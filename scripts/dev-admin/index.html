<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio admin</title>
<style>
:root {
  --bg: #111316; --panel: #181b1f; --panel2: #1f2328; --line: #2c3238; --line2: #3a424a;
  --text: #e6e8ea; --dim: #9aa3ab; --faint: #6b747c; --accent: #e0b04a; --accent2: #f3cc72;
  --ok: #5cc28a; --err: #ef6b6b; --warn: #e6a23c; --info: #6aa8e8;
  --add-bg: rgba(92,194,138,.13); --del-bg: rgba(239,107,107,.13);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --bar-h: 58px; --head-h: 48px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: var(--panel2); border: 1px solid var(--line2); border-radius: 6px; padding: 5px 10px; }
button:hover:not(:disabled) { border-color: var(--dim); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); color: #1a1407; border-color: var(--accent); font-weight: 600; }
button.primary:hover:not(:disabled) { background: var(--accent2); }
button.ghost { background: transparent; }
button.danger { border-color: rgba(239,107,107,.5); color: var(--err); background: transparent; }
button.danger.armed { background: var(--err); color: #fff; }
button.small { padding: 2px 7px; font-size: 12px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
input[type=text], input[type=number], input[type=date], input[type=search], select, textarea {
  background: var(--bg); border: 1px solid var(--line2); border-radius: 6px; padding: 6px 8px; width: 100%; }
textarea { resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; }
label.f { display: block; font-size: 12px; color: var(--dim); margin: 0 0 4px; letter-spacing: .02em; }
.hint { font-size: 12px; color: var(--faint); }
kbd { font: 11px var(--mono); border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--panel2); }

/* ---- header ---- */
header { position: sticky; top: 0; z-index: 20; height: var(--head-h); display: flex; align-items: center; gap: 14px;
  padding: 0 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: 15px; margin: 0; white-space: nowrap; }
header h1 span { color: var(--accent); }
.tabs { display: flex; gap: 2px; }
.tabs button { background: transparent; border: none; border-bottom: 2px solid transparent; border-radius: 0; padding: 12px 10px 11px; color: var(--dim); }
.tabs button.active { color: var(--text); border-bottom-color: var(--accent); }
.tabs .count { font-size: 11px; background: var(--warn); color: #1a1407; border-radius: 9px; padding: 0 6px; margin-left: 4px; }
.branch { margin-left: auto; font: 12px var(--mono); color: var(--dim); white-space: nowrap; }
.branch b.main { color: var(--err); }

/* ---- layout ---- */
main { height: calc(100vh - var(--head-h)); padding-bottom: var(--bar-h); }
.view { display: none; height: 100%; }
.view.active { display: grid; }
#view-projects { grid-template-columns: 300px minmax(0, 1fr) minmax(360px, 42%); }
#view-projects.no-preview { grid-template-columns: 300px minmax(0, 1fr); }
#view-projects.no-preview #preview { display: none; }
.pane { overflow: auto; border-right: 1px solid var(--line); min-width: 0; position: relative; }
.pane-head { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 12px; }
@media (max-width: 1180px) {
  #view-projects { grid-template-columns: 270px 1fr; }
  #preview { position: fixed; right: 0; top: var(--head-h); bottom: var(--bar-h); width: min(520px, 60vw); z-index: 15;
    background: var(--bg); box-shadow: -8px 0 24px rgba(0,0,0,.5); }
}

/* ---- list ---- */
#list-pane { background: var(--panel); }
.filters { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.filters .wide { grid-column: 1 / -1; }
.filters label { font-size: 12px; color: var(--dim); display: flex; gap: 4px; align-items: center; }
.list-meta { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--faint); margin-top: 8px; }
.list-meta .xf { color: var(--accent); cursor: pointer; }
.item { display: grid; grid-template-columns: 18px 1fr 10px; gap: 8px; align-items: start; padding: 8px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
.item:hover { background: var(--panel2); }
.item.active { background: #2a2617; box-shadow: inset 3px 0 0 var(--accent); }
.item input { margin: 3px 0 0; }
.item .t { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .s { font-size: 12px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; }
.dot.on { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
.pill { display: inline-block; font-size: 10.5px; padding: 0 6px; border-radius: 9px; border: 1px solid var(--line2); color: var(--dim); margin-left: 4px; vertical-align: 1px; }
.pill.draft { color: var(--warn); border-color: var(--warn); }
.empty { padding: 28px 16px; color: var(--faint); text-align: center; }

/* ---- form ---- */
#form-pane .pane-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
#form-pane .pane-head h2 { margin: 0; font-size: 16px; flex: 1; min-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#form-pane .pane-head .folder { font: 12px var(--mono); color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.form { padding: 14px 16px 40px; display: grid; gap: 16px; }
.row { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.section { border-top: 1px solid var(--line); padding-top: 14px; }
.section > h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); display: flex; align-items: center; gap: 8px; }
.section > h3 .hint { text-transform: none; letter-spacing: 0; }
.checks { display: flex; gap: 18px; flex-wrap: wrap; }
.checks label { display: flex; align-items: center; gap: 6px; }
.field-changed > label.f::after { content: " •"; color: var(--accent); }
.errors { border: 1px solid var(--err); background: var(--del-bg); border-radius: 6px; padding: 8px 12px; color: #ffd0d0; font-size: 13px; }
.errors ul { margin: 4px 0 0; padding-left: 18px; }
textarea.mono { font: 13px/1.5 var(--mono); }
textarea.auto { overflow: hidden; resize: none; min-height: 80px; }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px; border: 1px solid var(--line2); border-radius: 6px; background: var(--bg); min-height: 40px; }
.chips .sortable { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 2px; background: var(--panel2); border: 1px solid var(--line2); border-radius: 16px; padding: 2px 4px 2px 2px; }
.chip .handle { border: none; background: transparent; padding: 0 4px; }
.chip .x { border: none; background: transparent; padding: 0 5px; color: var(--dim); }
.chip.rare { border-color: var(--warn); }
.chips input { flex: 1; min-width: 160px; border: none; background: transparent; padding: 4px; }
.joined { font: 12px var(--mono); color: var(--faint); margin-top: 4px; }

/* sortable rows */
.sortable { position: relative; }
.srow { position: relative; display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
.srow > .body { flex: 1; display: grid; grid-template-columns: 1fr 1fr auto; gap: 6px; align-items: center; min-width: 0; }
.handle { cursor: grab; background: transparent; border: 1px solid transparent; color: var(--faint); padding: 4px 4px; line-height: 1; font-size: 15px; letter-spacing: -2px; user-select: none; }
.handle:hover, .handle:focus-visible { color: var(--accent); border-color: var(--line2); }
.srow.dragging, .chip.dragging, .thumb.dragging { opacity: .35; }
.drop-before::before, .drop-after::after { content: ""; position: absolute; left: 0; right: 0; height: 3px; background: var(--accent); border-radius: 2px; pointer-events: none; z-index: 3; }
.drop-before::before { top: -4px; } .drop-after::after { bottom: -4px; }
.hz .drop-before::before, .hz .drop-after::after { top: 0; bottom: 0; width: 3px; height: auto; left: auto; right: auto; }
.hz .drop-before::before { left: -5px; } .hz .drop-after::after { right: -5px; }

/* images */
.thumbs { display: flex; flex-wrap: wrap; gap: 8px; }
.thumb { position: relative; width: 112px; border: 1px solid var(--line2); border-radius: 6px; background: var(--bg); overflow: visible; }
.thumb img { width: 100%; height: 76px; object-fit: cover; display: block; border-radius: 5px 5px 0 0; }
.thumb .cap { font: 10.5px var(--mono); color: var(--dim); padding: 2px 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.thumb .ctl { display: flex; justify-content: space-between; padding: 0 2px 2px; }
.thumb .ctl button { border: none; background: transparent; padding: 0 4px; }
.thumb.pick { cursor: pointer; }
.thumb.pick.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.thumb.none { display: grid; place-items: center; height: 100px; color: var(--faint); }
.upload { display: inline-flex; align-items: center; gap: 6px; }
.upload input { display: none; }

/* preview */
#preview { display: flex; flex-direction: column; background: var(--bg); }
.badges { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge { font-size: 12px; border-radius: 12px; padding: 2px 9px; border: 1px solid var(--line2); background: var(--panel2); white-space: nowrap; }
.badge.yes { border-color: var(--ok); color: var(--ok); }
.badge.no { border-color: var(--line2); color: var(--dim); }
.badge.changed { box-shadow: 0 0 0 2px rgba(224,176,74,.5); }
.why { font-size: 11.5px; color: var(--faint); margin-top: 4px; }
#preview iframe { flex: 1; width: 100%; border: 0; background: #fff; }
#preview .note { padding: 30px; color: var(--faint); text-align: center; }

/* health / replace */
.page { overflow: auto; padding: 0 0 40px; }
.page-inner { max-width: 1040px; margin: 0 auto; padding: 0 20px; }
.page h2 { font-size: 16px; margin: 0; }
.group { margin-top: 18px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.group > h3 { margin: 0; padding: 8px 12px; background: var(--panel); font-size: 13px; display: flex; gap: 8px; align-items: center; }
.group > h3 .n { margin-left: auto; color: var(--faint); font-weight: 400; }
.warn { display: flex; gap: 10px; padding: 7px 12px; border-top: 1px solid var(--line); font-size: 13px; align-items: baseline; }
.warn a { color: var(--accent); cursor: pointer; text-decoration: none; white-space: nowrap; }
.warn a:hover { text-decoration: underline; }
.warn .msg { flex: 1; }
.lvl { font-size: 11px; border-radius: 4px; padding: 0 5px; }
.lvl.warn-l { background: var(--warn); color: #1a1407; } .lvl.info-l { background: var(--info); color: #08121c; }
.match { display: grid; grid-template-columns: 22px 220px 1fr; gap: 8px; padding: 6px 12px; border-top: 1px solid var(--line); align-items: baseline; font-size: 13px; }
.match .ctx { font-family: var(--mono); font-size: 12px; word-break: break-word; }
.match del { background: var(--del-bg); color: #ffb3b3; text-decoration: line-through; }
.match ins { background: var(--add-bg); color: #b8f0cf; text-decoration: none; }

/* floating action bar */
#bar { position: fixed; left: 0; right: 0; bottom: 0; height: var(--bar-h); z-index: 40; display: flex; align-items: center; gap: 10px;
  padding: 0 16px; background: rgba(24,27,31,.96); backdrop-filter: blur(6px); border-top: 1px solid var(--line2); box-shadow: 0 -6px 18px rgba(0,0,0,.35); }
#bar .count { font-weight: 600; }
#bar .count.clean { color: var(--faint); font-weight: 400; }
#bar .count .pdot { display: inline-block; width: 8px; height: 8px; background: var(--accent); border-radius: 50%; margin-right: 6px; }
#bar .spacer { flex: 1; }
/* bulk actions take over the bar's left side while projects are selected */
#bar-bulk { display: flex; align-items: center; gap: 4px; min-width: 0; overflow: hidden; white-space: nowrap; font-size: 12.5px; }
#bar-bulk b { margin-right: 4px; }
#bar-bulk .sep { color: var(--faint); padding: 0 2px; }
#bar-bulk select { width: auto; padding: 3px 6px; font-size: 12px; }
#bar .blocked { color: var(--err); }

/* ---- settings ---- */
#view-settings { grid-template-columns: 200px minmax(0, 1fr); }
#s-nav { background: var(--panel); border-right: 1px solid var(--line); overflow: auto; padding: 10px 0; }
#s-nav button { display: flex; width: 100%; text-align: left; border: none; border-radius: 0; background: transparent; padding: 7px 16px; color: var(--dim); gap: 6px; align-items: center; }
#s-nav button.active { color: var(--text); background: var(--panel2); box-shadow: inset 3px 0 0 var(--accent); }
#s-nav button .chg { color: var(--accent); }
#s-nav button .ec { margin-left: auto; font-size: 11px; background: var(--err); color: #fff; border-radius: 9px; padding: 0 6px; }
#s-nav .src { padding: 10px 16px; font: 11px var(--mono); color: var(--faint); word-break: break-all; }
#s-body { overflow: auto; }
.s-inner { max-width: 1180px; padding: 0 20px 60px; }
.s-inner > .pane-head { margin: 0 -20px 14px; padding: 12px 20px; display: flex; gap: 10px; align-items: center; }
.s-inner > .pane-head h2 { flex: 1; }
.s-grid { display: grid; gap: 14px; }
.s-split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 400px); gap: 18px; align-items: start; }
@media (max-width: 1100px) { .s-split { grid-template-columns: 1fr; } }
.sf { min-width: 0; }
.sf .count-l { font-size: 11.5px; color: var(--faint); text-align: right; margin-top: 2px; }
.sf .count-l.over { color: var(--warn); }
.sf-err { color: var(--err); font-size: 12px; margin-top: 3px; }
.sf-err:empty { display: none; }
.has-err > input, .has-err > textarea, .has-err > select, .has-err .chips { border-color: var(--err) !important; }
.srow > .sbody { flex: 1; min-width: 0; display: grid; gap: 6px; align-items: start; border: 1px solid var(--line); border-radius: 6px; padding: 8px; background: var(--panel); }
.srow > .sbody.flat { border: none; padding: 0; background: transparent; }
.s-cols { display: grid; gap: 6px; align-items: start; }
.s-meta { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--dim); flex-wrap: wrap; }
.s-meta a { color: var(--accent); cursor: pointer; }
.uses { font-size: 12px; color: var(--dim); }
.uses summary { cursor: pointer; color: var(--accent); }
.ro { opacity: .75; }
.glow-swatch { width: 120px; height: 56px; border-radius: 6px; border: 1px solid var(--line2); background-color: #0b0b0e; }
input[type=color] { width: 38px; height: 30px; padding: 0 2px; border: 1px solid var(--line2); border-radius: 6px; background: var(--bg); }
input[type=range] { width: 90px; }
.fitdemo { display: flex; gap: 10px; align-items: flex-end; }
.fitdemo .box { background: #0b0b0e; border: 1px dashed var(--line2); overflow: hidden; position: relative; }
.fitdemo .box img { width: 100%; height: 100%; display: block; }
.fitdemo .cap { font: 10.5px var(--mono); color: var(--faint); text-align: center; margin-top: 2px; }
.prev { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); position: sticky; top: 8px; }
.prev h3 { margin: 0; padding: 8px 12px; font-size: 13px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; }
.prev h3 .hint { margin-left: auto; font-weight: 400; }
.prev ol { margin: 0; padding: 6px 12px 10px 34px; font-size: 12.5px; }
.prev li { padding: 1px 0; }
.prev li.add { color: var(--ok); } .prev li.add::marker { content: "+ "; }
.prev li.del { color: var(--err); text-decoration: line-through; list-style: none; margin-left: -14px; }
.prev li.del::before { content: "− "; }
.prev .mv { font-size: 11px; color: var(--info); margin-left: 4px; }
.prev .sc { color: var(--faint); font: 11px var(--mono); margin-left: 4px; }
.contrast { display: grid; grid-template-columns: auto auto 1fr; gap: 6px 12px; align-items: center; font-size: 13px; }
.contrast .ratio { font: 13px var(--mono); }
.contrast .ratio.bad { color: var(--warn); }
.demo-pill { padding: 6px 12px; border-radius: 4px; font-size: 13px; white-space: nowrap; }
.tiertest { padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; font-size: 13px; background: var(--panel); }
.suggest { font-size: 12px; color: var(--warn); }

/* modal */
.modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 60; display: grid; place-items: center; padding: 20px; }
.modal { background: var(--panel); border: 1px solid var(--line2); border-radius: 10px; width: min(1100px, 100%); max-height: calc(100vh - 40px); display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
.modal.narrow { width: min(520px, 100%); }
.modal > .mh { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; }
.modal > .mh h2 { margin: 0; font-size: 16px; flex: 1; }
.modal > .mb { padding: 14px 16px; overflow: auto; display: grid; gap: 14px; }
.modal > .mf { padding: 10px 16px; border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
.ship-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(300px, 1fr); gap: 16px; align-items: start; }
@media (max-width: 1000px) { .ship-grid { grid-template-columns: 1fr; } }
pre.diff { margin: 0; font: 12px/1.45 var(--mono); background: var(--bg); padding: 8px 0; overflow: auto; max-height: 420px; }
pre.diff .dl { display: block; padding: 0 10px; white-space: pre-wrap; word-break: break-word; }
pre.diff .add { background: var(--add-bg); color: #b8f0cf; }
pre.diff .del { background: var(--del-bg); color: #ffc4c4; }
pre.diff .hunk { color: var(--info); }
pre.diff .meta { color: var(--faint); }
details.file { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
details.file + details.file { margin-top: 8px; }
details.file summary { padding: 6px 10px; background: var(--panel2); font: 12px var(--mono); cursor: pointer; }
.st { display: inline-block; min-width: 22px; font-weight: 700; }
.st-M { color: var(--warn); } .st-A, .st-\?\? { color: var(--ok); } .st-D { color: var(--err); }
.alert { border-radius: 6px; padding: 8px 12px; font-size: 13px; }
.alert.err { border: 1px solid var(--err); background: var(--del-bg); }
.alert.warn { border: 1px solid var(--warn); background: rgba(230,162,60,.1); }
.alert.ok { border: 1px solid var(--ok); background: var(--add-bg); }
.alert ul { margin: 4px 0 0; padding-left: 18px; font-family: var(--mono); font-size: 12px; }
pre.cmds { margin: 0; font: 12px/1.6 var(--mono); background: var(--bg); padding: 10px; border-radius: 6px; white-space: pre-wrap; word-break: break-word; border: 1px solid var(--line); }
.radio { display: flex; gap: 6px; align-items: baseline; margin: 3px 0; }
.field-err { color: var(--err); font-size: 12px; margin-top: 3px; }
.field-ok { color: var(--ok); font-size: 12px; margin-top: 3px; }
.help-grid { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; }

/* toasts */
#toasts { position: fixed; right: 16px; bottom: calc(var(--bar-h) + 12px); z-index: 80; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.toast { background: var(--panel2); border: 1px solid var(--line2); border-left: 4px solid var(--info); border-radius: 6px; padding: 8px 12px; max-width: 420px; box-shadow: 0 6px 18px rgba(0,0,0,.4); font-size: 13px; animation: tin .15s ease-out; }
.toast.ok { border-left-color: var(--ok); } .toast.err { border-left-color: var(--err); } .toast.warn { border-left-color: var(--warn); }
@keyframes tin { from { transform: translateY(6px); opacity: 0; } }
</style>
</head>
<body>
<header>
  <h1>Portfolio <span>admin</span></h1>
  <nav class="tabs" role="tablist">
    <button data-tab="projects" class="active">Projects</button>
    <button data-tab="health">Health <span class="count" id="health-count" hidden></span></button>
    <button data-tab="replace">Find &amp; replace</button>
    <button data-tab="settings">Settings <span class="count" id="settings-count" hidden></span></button>
  </nav>
  <button class="small" id="new-btn" title="New project">+ New project</button>
  <button class="small ghost" id="help-btn" title="Keyboard shortcuts (?)">?</button>
  <div class="branch" id="branch"></div>
</header>

<main>
  <section class="view active" id="view-projects">
    <div class="pane" id="list-pane">
      <div class="pane-head">
        <div class="filters">
          <input type="search" id="f-q" class="wide" placeholder="Search title, venue, role…  ( / )" aria-label="Search">
          <select id="f-disc" aria-label="Discipline"><option value="">All disciplines</option></select>
          <select id="f-year" aria-label="Year"><option value="">All years</option></select>
          <input type="text" id="f-role" placeholder="Role contains…" aria-label="Role contains">
          <select id="f-sort" aria-label="Sort">
            <option value="year-desc">Year ↓ (newest)</option>
            <option value="year-asc">Year ↑ (oldest)</option>
            <option value="title-asc">Title A–Z</option>
            <option value="title-desc">Title Z–A</option>
          </select>
          <label class="wide"><input type="checkbox" id="f-dirty"> Unsaved only</label>
        </div>
        <div class="list-meta"><span id="list-count"></span><span><a href="#" id="sel-all" class="hint">select shown</a></span></div>
      </div>
      <div id="list"></div>
    </div>
    <div class="pane" id="form-pane"><div class="empty">Loading…</div></div>
    <div class="pane" id="preview"></div>
  </section>

  <section class="view page" id="view-health"></section>
  <section class="view page" id="view-replace"></section>
  <section class="view" id="view-settings"><nav id="s-nav" aria-label="Settings sections"></nav><div id="s-body"></div></section>
</main>

<div id="bar" role="toolbar" aria-label="Unsaved changes">
  <div id="bar-bulk" role="group" aria-label="Bulk actions on selected projects" hidden></div>
  <span class="count clean" id="bar-count">No unsaved changes</span>
  <span class="hint" id="bar-detail"></span>
  <span class="spacer"></span>
  <button id="bar-discard" class="danger" disabled title="Discard every unsaved edit (click twice)">Discard</button>
  <button id="bar-preview" title="Toggle live preview">Preview</button>
  <button id="bar-ship" title="Review the diff, commit, push and open a PR">Review &amp; Ship</button>
  <button id="bar-save" class="primary" disabled title="Save all (⌘S / Ctrl+S)">Save <kbd>⌘S</kbd></button>
</div>
<div id="toasts" aria-live="polite"></div>

<script>
'use strict'
// ===========================================================================
// Portfolio dev admin — vanilla JS, no build. Served by plugin.mjs.
//
// State model: `saved[folder]` is the project as last loaded/saved from disk;
// `cur[folder]` is the working copy every input edits in place. A project is
// dirty when the two differ — edits survive switching projects and are only
// written by Save. Inputs mutate `cur` and call markDirty(), which updates
// dots/counts/badges WITHOUT re-rendering the form, so focus is never lost.
// ===========================================================================

const ADMIN = location.pathname.replace(/\/[^/]*$/, '')   // "/__admin" or "/portfolio/__admin"
const $ = (s, r = document) => r.querySelector(s)

let meta = { base: '/', enums: {}, defaults: {}, keys: [] }
let saved = {}       // folder -> { data, body, hash, images }
let cur = {}         // folder -> { data, body }
let errorsBy = {}    // folder -> [server validation errors]
let order = []       // folder list
let selected = null
const multi = new Set()
let showPreview = window.innerWidth > 1180
let scores = null    // last /api/score response for `selected`
let savedScores = {} // folder -> score at load/save time, to flag badge changes
let roleScores = {}  // folder -> roleScore (from server, for health)
let extraFilter = null // { kind: 'console'|'coverKind', key } from a Settings usage link
// Site settings (src/data/site.json): same saved/working-copy model as
// projects. ST is settings.mjs, loaded from the server so validation and
// ranking here are the exact code the server runs.
let ST = null
const S = { saved: null, cur: null, hash: null, source: null, path: null, serverErrors: [] }

// ---- utilities -------------------------------------------------------------

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag)
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === undefined || v === null || v === false) continue
    if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2), v)
    else if (k === 'class') n.className = v
    else if (k === 'style') n.style.cssText = v
    else if (k === 'value') n.value = v
    else if (k === 'checked') n.checked = !!v
    else if (k === 'dataset') Object.assign(n.dataset, v)
    else n.setAttribute(k, v === true ? '' : v)
  }
  for (const c of kids.flat(Infinity)) if (c !== null && c !== undefined && c !== false) n.append(c.nodeType ? c : String(c))
  return n
}
const clone = (v) => v === undefined ? undefined : JSON.parse(JSON.stringify(v))
function canon(v) {
  if (Array.isArray(v)) return v.map(canon)
  if (v && typeof v === 'object') { const o = {}; for (const k of Object.keys(v).sort()) if (v[k] !== undefined) o[k] = canon(v[k]); return o }
  return v
}
const same = (a, b) => JSON.stringify(canon(a)) === JSON.stringify(canon(b))
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms) } }
const typing = (e) => /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable
const kebab = (s) => s.toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/&/g, ' and ')
  .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '')
const rolesOf = (role) => String(role || '').split(' / ').map((s) => s.trim()).filter(Boolean)
const fileUrl = (folder, p) => `${ADMIN}/api/file?folder=${encodeURIComponent(folder)}&path=${encodeURIComponent(p)}`

async function api(method, url, body) {
  const res = await fetch(ADMIN + url, {
    method, headers: body !== undefined ? { 'content-type': 'application/json' } : {},
    body: body !== undefined ? JSON.stringify(body) : undefined,
  })
  let json = {}
  try { json = await res.json() } catch { /* empty */ }
  if (!res.ok) throw Object.assign(new Error(json.error || `${res.status} ${res.statusText}`), json, { status: res.status })
  return json
}

function toast(msg, kind = 'info', ms = 4500) {
  const t = el('div', { class: `toast ${kind}`, role: kind === 'err' ? 'alert' : 'status' }, msg)
  $('#toasts').append(t)
  setTimeout(() => t.remove(), kind === 'err' ? ms * 2 : ms)
}

// Two-click arm instead of confirm(): embedded browsers suppress native
// dialogs, which makes a confirm()-gated button look dead.
function armed(label, armedLabel, onFire, cls = 'danger') {
  let on = false, timer
  const b = el('button', { class: cls, type: 'button', onclick: () => {
    if (!on) {
      on = true; b.classList.add('armed'); b.textContent = armedLabel
      timer = setTimeout(() => { on = false; b.classList.remove('armed'); b.textContent = label }, 3500)
      return
    }
    clearTimeout(timer); on = false; b.classList.remove('armed'); b.textContent = label
    onFire()
  } }, label)
  return b
}

// ---- dirty tracking --------------------------------------------------------

// A default-valued key the file never had (e.g. `credits: []` added then
// emptied again) is not a change — drop it so the save leaves the file alone.
function normalize(folder) {
  const d = cur[folder].data, s = saved[folder].data
  for (const [k, def] of Object.entries(meta.defaults)) {
    if (!(k in s) && k in d && same(d[k], def)) delete d[k]
  }
  for (const k of ['venue', 'client']) if (!(k in s) && d[k] === '') delete d[k]
  for (const k of Object.keys(d)) if (d[k] === undefined) delete d[k]
}
function changedKeys(folder) {
  if (!cur[folder] || !saved[folder]) return []
  // Editors create empty lists (gallery: []) to bind to; those aren't edits.
  normalize(folder)
  const a = cur[folder].data, b = saved[folder].data
  const keys = [...new Set([...Object.keys(a), ...Object.keys(b)])].filter((k) => !same(a[k], b[k]))
  if (cur[folder].body !== saved[folder].body) keys.push('body')
  return keys
}
const isDirty = (folder) => changedKeys(folder).length > 0
const dirtyFolders = () => order.filter(isDirty)

const refreshScores = debounce(() => loadScores(), 250)
function markDirty(folder = selected) {
  normalize(folder)
  updateBar()
  updateListDots()
  updateFieldMarks()
  updateHealthCount()
  if (folder === selected) refreshScores()
}

function updateBar() {
  const folders = dirtyFolders()
  const sc = settingsChangedSections()
  const n = folders.reduce((s, f) => s + changedKeys(f).length, 0) + sc.length
  const sErr = sc.length ? settingsErrors().length : 0
  const c = $('#bar-count')
  c.className = 'count' + (n ? '' : ' clean')
  c.replaceChildren(...(n ? [el('span', { class: 'pdot' }), `${n} unsaved change${n === 1 ? '' : 's'}`] : ['No unsaved changes']))
  const parts = []
  if (folders.length) parts.push(`${folders.length} project${folders.length === 1 ? '' : 's'}: ${folders.map((f) => cur[f].data.title).slice(0, 3).join(', ')}${folders.length > 3 ? '…' : ''}`)
  if (sc.length) parts.push(`Settings: ${sc.join(', ')}`)
  $('#bar-detail').replaceChildren(n ? `in ${parts.join(' · ')}` : '',
    sErr ? el('span', { class: 'blocked' }, ` · settings have ${sErr} error${sErr === 1 ? '' : 's'} — not saveable`) : '')
  $('#bar-save').disabled = !n || (!folders.length && sErr > 0)
  $('#bar-save').title = sErr ? 'Settings are invalid — fix the marked fields first (projects still save)' : 'Save all (⌘S / Ctrl+S)'
  $('#bar-discard').disabled = !n
  const scn = $('#settings-count'); scn.hidden = !sc.length; scn.textContent = sErr ? '!' : sc.length
  scn.style.background = sErr ? 'var(--err)' : ''
  renderBulk()
  $('#bar-preview').classList.toggle('primary', false)
  $('#bar-preview').textContent = showPreview ? 'Hide preview' : 'Preview'
  document.title = (n ? '● ' : '') + 'Portfolio admin'
}
function updateListDots() {
  for (const it of document.querySelectorAll('#list .item')) {
    it.querySelector('.dot').classList.toggle('on', isDirty(it.dataset.folder))
  }
}
function updateFieldMarks() {
  if (!selected) return
  const ch = new Set(changedKeys(selected))
  for (const f of document.querySelectorAll('#form-pane [data-key]')) f.classList.toggle('field-changed', ch.has(f.dataset.key))
  const t = $('#form-pane .pane-head h2')
  if (t) t.textContent = cur[selected].data.title || '(untitled)'
  const rv = $('#revert-proj')
  if (rv) rv.disabled = !ch.size
}

window.addEventListener('beforeunload', (e) => {
  if (dirtyFolders().length || settingsDirty()) { e.preventDefault(); e.returnValue = '' }
})

// ---- load ------------------------------------------------------------------

function adopt(p) {
  saved[p.folder] = { data: clone(p.data), body: p.body, hash: p.hash, images: p.images || [] }
  cur[p.folder] = { data: clone(p.data), body: p.body }
  delete errorsBy[p.folder]
}

async function load() {
  let res
  try {
    ST = await import(ADMIN + '/settings.mjs')
    adoptSettings(await api('GET', '/api/settings'))
    res = await api('GET', '/api/projects')
  } catch (e) {
    $('#form-pane').replaceChildren(el('div', { class: 'empty' }, `Could not load: ${e.message}`))
    return
  }
  meta = res
  $('#branch').replaceChildren('on ', el('b', { class: /^(main|master)$/.test(res.branch) ? 'main' : '' }, res.branch || '?'))
  const broken = res.projects.filter((p) => p.error)
  for (const b of broken) toast(`${b.folder}: ${b.error} — skipped`, 'err')
  for (const p of res.projects.filter((p) => !p.error)) adopt(p)
  order = res.projects.filter((p) => !p.error).map((p) => p.folder)
  fillDisciplineFilter()
  fillYearFilter()
  const fromHash = decodeURIComponent(location.hash.slice(1))
  selected = order.includes(fromHash) ? fromHash : null
  renderList()
  if (!selected) selected = visibleFolders()[0] ?? null
  renderList(); renderForm(); renderPreview(); updateBar(); loadScores(true)
}

// Option labels come from the saved settings (what the server validates
// projects against); unknown keys show as-is.
function optLabel(kind, key) {
  const o = (S.saved?.[ST.KINDS[kind]] || []).find((x) => x.key === key)
  return o?.label || key
}
function fillDisciplineFilter() {
  const sel = $('#f-disc'), v = sel.value
  sel.replaceChildren(el('option', { value: '' }, 'All disciplines'),
    ...meta.enums.discipline.map((d) => el('option', { value: d }, optLabel('discipline', d))))
  sel.value = meta.enums.discipline.includes(v) ? v : ''
}
function fillYearFilter() {
  const sel = $('#f-year'), v = sel.value
  const years = [...new Set(order.map((f) => cur[f].data.year))].sort((a, b) => b - a)
  sel.replaceChildren(el('option', { value: '' }, 'All years'), ...years.map((y) => el('option', { value: y }, y)))
  sel.value = v
}

// ---- list pane ---------------------------------------------------------------

function visibleFolders() {
  const q = $('#f-q').value.trim().toLowerCase()
  const disc = $('#f-disc').value, year = $('#f-year').value
  const role = $('#f-role').value.trim().toLowerCase()
  const dirtyOnly = $('#f-dirty').checked
  const [key, dir] = $('#f-sort').value.split('-')
  return order.filter((f) => {
    const d = cur[f].data
    if (disc && d.discipline !== disc) return false
    if (year && String(d.year) !== year) return false
    if (role && !String(d.role || '').toLowerCase().includes(role)) return false
    if (dirtyOnly && !isDirty(f)) return false
    if (extraFilter && (d[extraFilter.kind] ?? meta.defaults[extraFilter.kind]) !== extraFilter.key) return false
    if (q && ![d.title, f, d.venue, d.client, d.role].some((x) => String(x || '').toLowerCase().includes(q))) return false
    return true
  }).sort((a, b) => {
    const A = cur[a].data, B = cur[b].data
    const c = key === 'year'
      ? (A.year - B.year) || String(A.publishedAt).localeCompare(String(B.publishedAt))
      : String(A.title).localeCompare(String(B.title), undefined, { sensitivity: 'base' })
    return dir === 'asc' ? c : -c
  })
}

function renderList() {
  const vis = visibleFolders()
  $('#list-count').replaceChildren(`${vis.length} of ${order.length} projects`,
    extraFilter ? el('span', { class: 'xf', title: 'Clear this filter', onclick: () => { extraFilter = null; renderList() } },
      ` · ${extraFilter.kind} = ${optLabel(extraFilter.kind, extraFilter.key)} ×`) : '')
  if (!vis.length) {
    $('#list').replaceChildren(el('div', { class: 'empty' }, order.length ? 'No projects match these filters.' : 'No projects yet — create one with “+ New project”.'))
  } else {
    $('#list').replaceChildren(...vis.map((f) => {
      const d = cur[f].data
      const cb = el('input', { type: 'checkbox', checked: multi.has(f), 'aria-label': `Select ${d.title}`,
        onclick: (e) => { e.stopPropagation(); cb.checked ? multi.add(f) : multi.delete(f); renderBulk() } })
      return el('div', { class: 'item' + (f === selected ? ' active' : ''), dataset: { folder: f }, tabindex: 0,
        onclick: () => select(f), onkeydown: (e) => { if (e.key === 'Enter') select(f) } },
        cb,
        el('div', { style: 'min-width:0' },
          el('div', { class: 't' }, d.title || '(untitled)', d.draft ? el('span', { class: 'pill draft' }, 'draft') : null),
          el('div', { class: 's' }, `${d.year} · ${optLabel('discipline', d.discipline)} · ${d.role || ''}`)),
        el('span', { class: 'dot' + (isDirty(f) ? ' on' : ''), title: isDirty(f) ? 'Unsaved changes' : '' }))
    }))
  }
  renderBulk()
}

// Bulk actions live in the fixed bottom bar (left side) so selecting never
// shifts the list. Shown only on the Projects tab; Esc clears the selection.
let bulkKey = ''
function renderBulk() {
  const box = $('#bar-bulk')
  for (const f of [...multi]) if (!order.includes(f)) multi.delete(f)
  const on = multi.size > 0 && $('#view-projects').classList.contains('active')
  box.hidden = !on
  $('#bar-count').hidden = on
  $('#bar-detail').hidden = on
  if (!on) { bulkKey = ''; return }
  const sel = [...multi]
  // Re-render only when the selection or its dirty state changed, so an
  // open <select> is not torn down under the pointer.
  const key = sel.join('|') + '#' + sel.filter(isDirty).length + '#' + meta.enums.discipline.join()
  if (key === bulkKey && box.childElementCount) return
  bulkKey = key
  const apply = (fn, what) => { for (const f of sel) { fn(cur[f].data); markDirty(f) } renderList(); renderForm(); toast(`${what} on ${sel.length} project(s) — unsaved`, 'info') }
  const disc = el('select', { 'aria-label': 'Set discipline', onchange: () => { if (disc.value) apply((d) => { d.discipline = disc.value }, `discipline → ${disc.value}`) } },
    el('option', { value: '' }, 'Set discipline ▾'), ...meta.enums.discipline.map((d) => el('option', { value: d }, optLabel('discipline', d))))
  const sep = () => el('span', { class: 'sep' }, '·')
  const dirtySel = sel.filter(isDirty)
  box.replaceChildren(
    el('b', {}, `${sel.length} selected`), sep(),
    el('button', { class: 'small', onclick: () => apply((d) => { d.draft = true }, 'draft on') }, 'Draft on'), sep(),
    el('button', { class: 'small', onclick: () => apply((d) => { d.draft = false }, 'draft off') }, 'Draft off'), sep(),
    el('button', { class: 'small', onclick: () => apply((d) => { d.featured = true }, 'featured on') }, 'Feature'), sep(),
    el('button', { class: 'small', onclick: () => apply((d) => { d.featured = false }, 'featured off') }, 'Unfeature'), sep(),
    disc, sep(),
    el('button', { class: 'small', disabled: !dirtySel.length, title: dirtySel.length ? `Save the ${dirtySel.length} selected project(s) with edits` : 'No unsaved edits in the selection', onclick: () => saveFolders(sel.filter(isDirty)) }, 'Save these'), sep(),
    el('button', { class: 'small ghost', title: 'Clear selection (Esc)', onclick: clearSelection }, 'Clear'))
}
function clearSelection() { multi.clear(); renderList() }

for (const id of ['#f-q', '#f-role']) $(id).addEventListener('input', () => renderList())
for (const id of ['#f-disc', '#f-year', '#f-sort', '#f-dirty']) $(id).addEventListener('change', () => renderList())
$('#sel-all').addEventListener('click', (e) => {
  e.preventDefault()
  const vis = visibleFolders()
  if (vis.every((f) => multi.has(f))) vis.forEach((f) => multi.delete(f)); else vis.forEach((f) => multi.add(f))
  renderList()
})

function select(folder) {
  if (folder === selected) return
  selected = folder
  history.replaceState(null, '', '#' + encodeURIComponent(folder))
  scores = null
  for (const it of document.querySelectorAll('#list .item')) it.classList.toggle('active', it.dataset.folder === folder)
  renderForm(); renderPreview(); loadScores()
}

// ---- reorderable lists (native DnD + Alt+↑/↓) --------------------------------

// `items` is the live array; rows are re-drawn after a move. Dragging starts
// only from the handle so text inside rows stays selectable.
function sortable(items, renderRow, onChange, { horizontal = false, rowClass = 'srow', label = 'item' } = {}) {
  const wrap = el('div', { class: 'sortable' + (horizontal ? ' hz' : '') })
  let from = null
  const clear = () => wrap.querySelectorAll('.drop-before,.drop-after').forEach((n) => n.classList.remove('drop-before', 'drop-after'))
  const move = (a, b) => {
    if (b < 0 || b >= items.length || a === b) return
    const [x] = items.splice(a, 1); items.splice(b, 0, x)
    onChange(); draw(b)
  }
  const draw = (focusIdx) => {
    wrap.replaceChildren(...items.map((it, i) => {
      const handle = el('button', { type: 'button', class: 'handle', title: 'Drag to reorder · Alt+↑/↓', 'aria-label': `Reorder ${label} ${i + 1} of ${items.length} (Alt+Up/Down)` }, '⋮⋮')
      const row = el('div', { class: rowClass, dataset: { i } }, handle,
        renderRow(it, i, () => { items.splice(i, 1); onChange(); draw() }))
      handle.addEventListener('mousedown', () => { row.draggable = true })
      handle.addEventListener('mouseup', () => { row.draggable = false })
      handle.addEventListener('keydown', (e) => {
        if (!e.altKey) return
        const back = e.key === 'ArrowUp' || (horizontal && e.key === 'ArrowLeft')
        const fwd = e.key === 'ArrowDown' || (horizontal && e.key === 'ArrowRight')
        if (back || fwd) { e.preventDefault(); move(i, i + (back ? -1 : 1)) }
      })
      row.addEventListener('dragstart', (e) => {
        from = i; e.dataTransfer.effectAllowed = 'move'
        e.dataTransfer.setData('text/plain', String(i))
        requestAnimationFrame(() => row.classList.add('dragging'))
      })
      row.addEventListener('dragend', () => { row.draggable = false; row.classList.remove('dragging'); from = null; clear() })
      row.addEventListener('dragover', (e) => {
        if (from === null) return
        e.preventDefault(); e.dataTransfer.dropEffect = 'move'
        const r = row.getBoundingClientRect()
        const after = horizontal ? e.clientX > r.left + r.width / 2 : e.clientY > r.top + r.height / 2
        clear(); row.classList.add(after ? 'drop-after' : 'drop-before')
      })
      row.addEventListener('drop', (e) => {
        if (from === null) return
        e.preventDefault()
        const after = row.classList.contains('drop-after')
        let to = i + (after ? 1 : 0)
        if (from < to) to -= 1
        const f = from; from = null; clear()
        move(f, to)
      })
      return row
    }))
    if (focusIdx !== undefined) wrap.children[focusIdx]?.querySelector('.handle')?.focus()
  }
  draw()
  return wrap
}

// ---- form ------------------------------------------------------------------------

function field(label, key, input, hint) {
  return el('div', { dataset: { key } }, el('label', { class: 'f' }, label), input, hint ? el('div', { class: 'hint' }, hint) : null)
}
function textInput(d, key, { placeholder, onAfter } = {}) {
  return el('input', { type: 'text', value: d[key] ?? '', placeholder,
    oninput: (e) => { d[key] = e.target.value; markDirty(); onAfter?.() } })
}
function autoGrow(ta) {
  const fit = () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 2 + 'px' }
  ta.addEventListener('input', fit)
  requestAnimationFrame(fit)
  return ta
}
function enumSelect(d, key) {
  const def = meta.defaults[key]
  const vals = [...meta.enums[key]]
  // A value no longer in settings stays visible (and fails validation) rather than silently changing.
  if (d[key] !== undefined && !vals.includes(d[key])) vals.push(d[key])
  return el('select', { onchange: (e) => { d[key] = e.target.value; markDirty() } },
    ...vals.map((v) => {
      const known = meta.enums[key].includes(v)
      const o = el('option', { value: v }, `${optLabel(key, v)}${v === def ? ' (default)' : ''}${known ? '' : ' — not in settings'}`)
      if ((d[key] ?? def) === v) o.selected = true
      return o
    }))
}
function check(d, key, label) {
  return el('label', { dataset: { key } }, el('input', { type: 'checkbox', checked: d[key] ?? meta.defaults[key],
    onchange: (e) => { d[key] = e.target.checked; markDirty(); if (key === 'draft') { renderList(); renderPreview() } } }), label)
}

function renderForm() {
  const pane = $('#form-pane')
  if (!selected || !cur[selected]) {
    pane.replaceChildren(el('div', { class: 'empty' }, order.length ? 'Select a project on the left.' : 'No projects yet.'))
    return
  }
  const f = selected, d = cur[f].data
  const s = saved[f]

  const del = armed('Delete', 'Click again: delete folder', async () => {
    try {
      await api('DELETE', `/api/project?folder=${encodeURIComponent(f)}&hash=${s.hash}`)
      order = order.filter((x) => x !== f); delete cur[f]; delete saved[f]; multi.delete(f)
      selected = visibleFolders()[0] ?? null
      toast(`Deleted ${f} — it will be part of the next Ship`, 'ok')
      renderList(); renderForm(); renderPreview(); updateBar(); updateHealthCount()
    } catch (e) { toast(`Delete failed: ${e.message}`, 'err') }
  })
  del.title = 'Deletes the project folder from disk (click twice)'

  const head = el('div', { class: 'pane-head' },
    el('div', { style: 'flex:1;min-width:0' }, el('h2', {}, d.title || '(untitled)'), el('div', { class: 'folder' }, `${meta.projectsDir}/${f}/index.mdx`)),
    el('button', { class: 'small', id: 'revert-proj', disabled: !isDirty(f), title: 'Discard this project\'s unsaved edits',
      onclick: () => { cur[f] = { data: clone(s.data), body: s.body }; delete errorsBy[f]; markDirty(f); renderForm(); renderList(); toast('Edits discarded', 'info') } }, 'Revert edits'),

// Role chips -------------------------------------------------------------------
// Terms in use across projects (incl. unsaved edits) → count, most used first.
function rolesInUse() {
  const n = new Map()
  for (const f of order) for (const r of new Set(rolesOf(cur[f].data.role))) n.set(r, (n.get(r) || 0) + 1)
  return [...n.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
}
// Suggestion list for role chips: roles.vocabulary in its settings order,
// then any term in use that the vocabulary lacks. [term, count, inVocab]
function roleVocab() {
  const used = new Map(rolesInUse())
  const vocab = S.cur?.roles?.vocabulary || []
  const out = vocab.filter((t) => typeof t === 'string' && t.trim()).map((t) => [t, used.get(t) || 0, true])
  for (const [t, c] of used) if (!vocab.includes(t)) out.push([t, c, false])
  return out
}
function roleChips(d) {
  const box = el('div')
  const draw = (focusInput) => {
    const roles = rolesOf(d.role)
    const vocab = roleVocab()
    const inVocab = new Set(vocab.filter((v) => v[2]).map((v) => v[0]))
    const commit = () => { d.role = roles.join(' / '); markDirty(); joined.textContent = d.role ? `role: ${d.role}` : 'role: (empty — required)' }
    const list = sortable(roles, (r, i, remove) => el('span', { class: 'chip-body', style: 'display:inline-flex;align-items:center' },
      el('span', { style: 'padding:0 4px' }, r),
      el('button', { type: 'button', class: 'x', title: `Remove ${r}`, 'aria-label': `Remove ${r}`, onclick: () => { remove(); draw() } }, '×')),
      () => commit(), { horizontal: true, rowClass: 'chip', label: 'role' })
    for (const c of list.children) if (!inVocab.has(roles[+c.dataset.i])) { c.classList.add('rare'); c.title = 'Not in Settings → Roles → vocabulary' }
    const dl = el('datalist', { id: 'role-vocab' }, ...vocab.filter(([r]) => !roles.includes(r)).map(([r, c, v]) => el('option', { value: r }, `${c} project${c === 1 ? '' : 's'}${v ? '' : ' · not in vocabulary'}`)))
    const input = el('input', { type: 'text', list: 'role-vocab', placeholder: roles.length ? 'Add role…' : 'Add a role (type or pick)…', 'aria-label': 'Add role',
      onkeydown: (e) => {
        if ((e.key === 'Enter' || e.key === 'Tab' && input.value.trim()) ) {
          e.preventDefault()
          add(input.value)
        } else if (e.key === 'Backspace' && !input.value && roles.length) { roles.pop(); commit(); draw(true) }
      },
      onchange: () => { if (vocab.some(([r]) => r === input.value.trim())) add(input.value) } })
    const add = (v) => {
      const parts = rolesOf(v.replace(/\s*\/\s*/g, ' / '))
      if (!parts.length) return
      // Match vocabulary case-insensitively so "lighting programmer" reuses the canonical spelling.
      for (const p of parts) {
        const canonical = vocab.find(([r]) => r.toLowerCase() === p.toLowerCase())?.[0] ?? p
        if (!roles.includes(canonical)) roles.push(canonical)
      }
      commit(); draw(true)
    }
    const joined = el('div', { class: 'joined' }, d.role ? `role: ${d.role}` : 'role: (empty — required)')
    box.replaceChildren(el('div', { class: 'chips' }, list, input, dl), joined)
    if (focusInput) input.focus()
  }
  draw()
  return box
}

// ---- health -------------------------------------------------------------------------

function lev(a, b) {
  const m = a.length, n = b.length
  if (Math.abs(m - n) > 2) return 3
  let prev = Array.from({ length: n + 1 }, (_, j) => j)
  for (let i = 1; i <= m; i++) {
    const row = [i]
    for (let j = 1; j <= n; j++) row[j] = Math.min(prev[j] + 1, row[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1))
    prev = row
  }
  return prev[n]
}
// "Spot Operator" vs "Followspot Operator": one is a suffix of the other with
// the join inside a word. "Electrician" vs "Master Electrician" joins at a
// space — a genuinely different role — so it is not flagged.
function nearDup(a, b) {
  const x = a.toLowerCase(), y = b.toLowerCase()
  if (x === y) return 'differs only in case'
  if (x.replace(/[\s-]/g, '') === y.replace(/[\s-]/g, '')) return 'differs only in spacing'
  const [s, l] = x.length < y.length ? [x, y] : [y, x]
  if (l.endsWith(s) && /[a-z]/.test(l[l.length - s.length - 1] || '')) return 'one is the other with a prefix glued on'
  if (s.length >= 6 && lev(x, y) <= 2) return 'spelling differs by ≤ 2 letters'
  return null
}

function healthIssues() {
  const out = []   // { kind, level, folder?, msg }
  const add = (kind, level, folder, msg) => out.push({ kind, level, folder, msg })
  // Vocabulary is Settings → Roles → vocabulary; a role outside it is flagged.
  const vocabSet = new Set(S.cur?.roles?.vocabulary || [])
  const inUse = rolesInUse()
  const use = new Map()
  for (const f of order) for (const r of new Set(rolesOf(cur[f].data.role))) { if (!use.has(r)) use.set(r, []); use.get(r).push(f) }
  for (const [r, c] of inUse) {
    if (vocabSet.has(r)) continue
    if (c === 1) add('rare-role', 'info', use.get(r)[0], `“${r}” is not in the role vocabulary (Settings → Roles)`)
    else add('rare-role', 'info', null, el('span', {}, `“${r}” (${c} projects) is not in the role vocabulary (Settings → Roles): `, ...use.get(r).map((f) => projLink(f, true))))
  }
  for (let i = 0; i < inUse.length; i++) for (let j = i + 1; j < inUse.length; j++) {

    frMatches = []

    const norm = (s) => cs.checked ? s : s.toLowerCase()

      if (scopes.synopsis.checked) fields.push([['synopsis'], 'synopsis'])

        el('span', { style: 'flex:1' }), applyBtn),
      frMatches.length ? el('div', { class: 'group', style: 'margin-top:0' }, ...shown.map((m) => {
        const pre = m.text.slice(Math.max(0, m.at - 40), m.at), post = m.text.slice(m.at + m.len, m.at + m.len + 40)
        return el('label', { class: 'match' },
          el('input', { type: 'checkbox', checked: m.on, onchange: (e) => { m.on = e.target.checked; applyBtn.disabled = !frMatches.some((x) => x.on); applyBtn.textContent = `Apply ${frMatches.filter((x) => x.on).length} as unsaved edits` } }),
          el('span', {}, el('a', { onclick: (e) => { e.preventDefault(); goTo(m.folder) } }, cur[m.folder].data.title), el('div', { class: 'hint' }, m.label)),
          el('span', { class: 'ctx' }, (m.at > 40 ? '…' : '') + pre, el('del', {}, m.text.slice(m.at, m.at + m.len)), el('ins', {}, repl.value), post + (m.at + m.len + 40 < m.text.length ? '…' : '')))

function openModal(node, { narrow = false, onClose } = {}) {
  const back = el('div', { class: 'modal-back', onmousedown: (e) => { if (e.target === back) close() } })
  const box = el('div', { class: 'modal' + (narrow ? ' narrow' : ''), role: 'dialog', 'aria-modal': 'true' })
  const prevFocus = document.activeElement
  const close = () => { back.remove(); modalStack = modalStack.filter((m) => m !== entry); onClose?.(); prevFocus?.focus?.() }
  const entry = { close }
  box.append(...[].concat(node(close)))
  back.append(box); document.body.append(back)
  modalStack.push(entry)

function diffPre(diff) {
  const pre = el('pre', { class: 'diff' })
  for (const line of diff.split('\n')) {
    const cls = line.startsWith('+') && !line.startsWith('+++') ? 'add'
      : line.startsWith('-') && !line.startsWith('---') ? 'del'
      : line.startsWith('@@') ? 'hunk' : /^(diff |index |new file|deleted file|Binary|\+\+\+|---)/.test(line) ? 'meta' : ''
    pre.append(el('span', { class: `dl ${cls}` }, line || ' '))
  }
  return pre
}
function draftText(projects, settings) {
  if (!settings) return draftProjects(projects)
  const sline = `Site settings (${settings.path}): ${settings.kind === 'added' ? 'added' : settings.sections.join(', ') || 'changed'}`
  if (!projects.length) {
    const subject = settings.kind === 'added' ? 'Add site settings' : `Update site settings: ${settings.sections.slice(0, 3).join(', ')}${settings.sections.length > 3 ? '…' : ''}`
    return {
      subject,
      message: `${subject}\n\n- ${sline}\n`,
      body: `## Settings changes\n\n- ${sline}\n\n## Check\n\n- [ ] /\n- [ ] /work\n${settings.resumeChanged ? '- [ ] /resume (and regenerate the PDF: `npm run resume:pdf`)\n' : ''}`,
    }
  }
  const p = draftProjects(projects)
  return {
    subject: `${p.subject} + site settings`,
    message: p.message.replace(/\n*$/, '\n') + `- ${sline}\n`,
    body: p.body.replace('## Check', `## Settings changes\n\n- ${sline}\n\n## Check`) + (settings.resumeChanged ? '- [ ] /resume (and regenerate the PDF: `npm run resume:pdf`)\n' : ''),
  }
}
function draftProjects(projects) {
  const verb = (p) => p.kind === 'added' ? 'Add' : p.kind === 'deleted' ? 'Remove' : 'Update'
  const what = (p) => {
    if (p.kind !== 'modified') return p.kind === 'added' ? 'new project' : 'project removed'
    const bits = [...p.keys]
    if (p.bodyChanged) bits.push('body')
    const imgs = p.images.filter((i) => i.status !== 'M' && i.status !== 'D').length
    if (imgs) bits.push(`${imgs} new image${imgs === 1 ? '' : 's'}`)
    return bits.join(', ') || 'files changed'
  }
  let subject
  if (projects.length === 1) {
    const p = projects[0]
    subject = p.kind === 'modified' && p.keys.length && p.keys.length <= 2 && !p.bodyChanged
      ? `Update ${p.title}: ${p.keys.join(' and ')}`
      : `${verb(p)} ${p.title}`
  } else {
    const kinds = new Set(projects.map(verb))
    const v = kinds.size === 1 ? [...kinds][0] : 'Update'
    const names = projects.slice(0, 3).map((p) => p.title).join(', ')
    subject = `${v} ${names}${projects.length > 3 ? ` and ${projects.length - 3} more` : ''}`
  }
  const lines = projects.map((p) => `- ${p.title} (${p.folder}): ${what(p)}`)
  return {
    subject,
    message: `${subject}\n\n${lines.join('\n')}\n`,
    body: `## Content changes\n\n${projects.map((p) => `- **${p.title}** (\`${p.folder}\`) — ${what(p)}`).join('\n')}\n\n## Check\n\n${projects.filter((p) => p.kind !== 'deleted').map((p) => `- [ ] /work/${p.folder}`).join('\n') || '- [ ] /work'}\n`,
  }
}

              el('summary', {}, el('span', { class: `st st-${f.status.trim() === '??' ? 'A' : f.status.trim()}` }, f.status.trim() === '??' ? 'A' : f.status.trim()), ' ', f.path),
              diffPre(f.diff)))) : el('div', { class: 'empty' }, 'Nothing to ship — no saved panel changes in the working tree.')),
          el('div', { style: 'display:grid;gap:12px' },
            el('div', { class: 'hint' }, 'Current branch: ', el('code', {}, rv.branch)),

      foot.replaceChildren(el('span', { class: 'hint', style: 'flex:1' }, 'Esc to close'), el('button', { onclick: close }, 'Close'), shipBtn)
      drawMode(); if (mode === 'new' || onMain) checkBranch()

    }
    return [el('div', { class: 'mh' }, el('h2', {}, 'Review & Ship'), el('button', { class: 'small ghost', onclick: close }, 'Esc')), body, foot]
  })

// ---- settings (src/data/site.json) -------------------------------------------------------
//
// Same model as projects: S.saved is what is on disk, S.cur the working copy
// that every input mutates in place; dirty = they differ. Inputs call
// settingsChanged(), which re-validates (settings.mjs) and updates inline
// errors, change dots and the bar WITHOUT re-rendering, so focus is kept.

function adoptSettings(r) {
  S.saved = clone(r.data); S.cur = clone(r.data)
  S.hash = r.hash; S.source = r.source; S.path = r.path; S.serverErrors = []
}
const settingsDirty = () => !!S.cur && !same(S.cur, S.saved)
const settingsChangedSections = () => (S.cur ? ST.changedSections(S.cur, S.saved) : [])
const savedProjects = () => order.map((f) => ({ folder: f, data: saved[f].data }))
const curProjects = () => order.map((f) => ({ folder: f, data: cur[f].data }))
function settingsErrors() {
  if (!S.cur) return []
  return [...ST.validateSettings(S.cur), ...ST.deletedInUse(S.cur, savedProjects()), ...S.serverErrors]
}

const SSECTIONS = [
  ['identity', 'Identity', ['identity']],
  ['contact', 'Contact', ['contact']],
  ['nav', 'Navigation', ['nav']],
  ['disciplines', 'Disciplines', ['disciplines', 'defaults.discipline']],
  ['consoles', 'Consoles', ['consoles', 'defaults.console']],
  ['coverKinds', 'Cover kinds', ['coverKinds', 'defaults.coverKind']],
  ['roles', 'Roles', ['roles', 'defaults.newProjectRole']],
  ['ranking', 'Ranking', ['ranking']],
  ['resume', 'Résumé', ['resume']],
  ['about', 'About', ['about']],
  ['theme', 'Theme', ['theme']],
]
const under = (p, prefix) => p === prefix || p.startsWith(prefix + '.')
const sectionOf = (p) => SSECTIONS.find(([, , pre]) => pre.some((x) => under(p, x)))?.[0] ?? 'identity'
const PREVIEW_SECTIONS = new Set(['ranking', 'roles', 'coverKinds'])
let sSec = 'identity'
let sRoleTest = ''
const autoKey = new WeakSet()   // new keyed rows whose key still follows the label

function setPath(o, p, v) {
  const ks = p.split('.'), last = ks.pop()
  const parent = ks.reduce((x, k) => x[k], o)
  parent[last] = v
}

const refreshSettingsPreview = debounce(() => loadSettingsPreview(), 350)
function settingsChanged() {
  S.serverErrors = []
  updateSettingsMarks()
  updateBar()
  if (PREVIEW_SECTIONS.has(sSec)) refreshSettingsPreview()
}

function updateSettingsMarks() {
  if (!S.cur || !isTab('settings')) { if (S.cur) renderSettingsNavIfShown(); return }
  const errs = settingsErrors()
  const shown = new Set()
  for (const w of document.querySelectorAll('#s-body [data-sp]')) {
    const sp = w.dataset.sp
    const mine = errs.filter((e) => e.path === sp)
    for (const e of mine) shown.add(e)
    const box = w.querySelector(':scope > .sf-err')
    if (box) box.textContent = mine.map((e) => e.msg).join(' · ')
    w.classList.toggle('has-err', mine.length > 0)
    w.classList.toggle('field-changed', !same(ST.getPath(S.cur, sp), ST.getPath(S.saved, sp)))
  }
  const orphans = errs.filter((e) => !shown.has(e) && sectionOf(e.path) === sSec)
  $('#s-orphans')?.replaceChildren(...(orphans.length ? [el('div', { class: 'errors', role: 'alert' }, el('b', {}, 'Fix before saving:'),
    el('ul', {}, ...orphans.map((e) => el('li', {}, `${e.path}: ${e.msg}`))))] : []))
  renderSettingsNav(errs)
}
function renderSettingsNavIfShown() { if (isTab('settings')) renderSettingsNav() }
function renderSettingsNav(errs = settingsErrors()) {
  $('#s-nav').replaceChildren(...SSECTIONS.map(([k, label, pre]) => {
    const ch = pre.some((p) => !same(ST.getPath(S.cur, p), ST.getPath(S.saved, p)))
    const n = errs.filter((e) => sectionOf(e.path) === k).length
    return el('button', { type: 'button', class: k === sSec ? 'active' : '', 'aria-current': k === sSec ? 'true' : undefined,
      onclick: () => { sSec = k; renderSettings(true) } },
      label, ch ? el('span', { class: 'chg', title: 'Unsaved changes' }, '•') : null,
      n ? el('span', { class: 'ec', title: `${n} error(s)` }, n) : null)
  }), el('div', { class: 'src', title: 'File these settings are read from and saved to' }, (S.source === 'fixture' ? '⚠ fixture · ' : '') + S.path))
}

function renderSettings(resetScroll = false) {
  const body = $('#s-body')
  if (!S.cur) { body.replaceChildren(el('div', { class: 'empty' }, 'Settings are not loaded.')); return }
  const [key, title, pre] = SSECTIONS.find((x) => x[0] === sSec)
  const top = body.scrollTop
  const changed = pre.some((p) => !same(ST.getPath(S.cur, p), ST.getPath(S.saved, p)))
  const reload = async () => {
    try {
      adoptSettings(await api('GET', '/api/settings'))
      renderSettings(); updateBar(); toast('Settings reloaded from disk', 'info')
    } catch (e) { toast(`Reload failed: ${e.message}`, 'err') }
  }
  body.replaceChildren(el('div', { class: 's-inner' },
    el('div', { class: 'pane-head' }, el('h2', {}, title),
      el('button', { class: 'small', disabled: !changed, title: 'Put this section back to the saved values',
        onclick: () => { for (const p of pre) setPath(S.cur, p, clone(ST.getPath(S.saved, p))); renderSettings(); settingsChanged() } }, 'Revert section'),
      settingsDirty() ? (() => { const b = armed('↻ Reload', 'Click again: drop settings edits', reload, 'small'); b.title = 'Re-read settings from disk'; return b })()
        : el('button', { class: 'small', title: 'Re-read settings from disk', onclick: reload }, '↻ Reload')),
    S.source === 'fixture' ? el('div', { class: 'alert warn', style: 'margin-bottom:12px' }, 'src/data/site.json does not exist on this branch — editing the dev fixture ',
      el('code', {}, S.path), '. Saves go there.') : null,
    el('div', { id: 's-orphans' }),
    SECTION_RENDER[key]()))
  body.scrollTop = resetScroll ? 0 : top
  updateSettingsMarks()
  if (PREVIEW_SECTIONS.has(key)) loadSettingsPreview()
}

async function saveSettings() {
  const local = [...ST.validateSettings(S.cur), ...ST.deletedInUse(S.cur, savedProjects())]
  if (local.length) {
    toast(`Settings not saved — ${local.length} problem${local.length === 1 ? '' : 's'} to fix (marked in red)`, 'err')
    sSec = sectionOf(local[0].path); switchTab('settings')
    document.querySelector('#s-body .has-err input, #s-body .has-err textarea, #s-body .has-err select')?.focus()
    return false
  }
  try {
    const r = await api('PUT', '/api/settings', { data: S.cur, hash: S.hash })
    adoptSettings(r)
    meta.enums = r.enums; meta.defaults = r.defaults; meta.newProject = r.newProject
    savedScores = {}; bulkKey = ''
    fillDisciplineFilter()
    if (isTab('settings')) renderSettings()
    renderList(); renderForm(); updateHealthCount(); loadScores(true)
    toast(r.changed.length ? `Saved settings (${r.changed.join(', ')}) to ${r.path}` : 'Settings unchanged on disk', 'ok')
    return true
  } catch (e) {
    S.serverErrors = Array.isArray(e.errors) ? e.errors : []
    toast(`Settings not saved: ${e.message}`, 'err', 7000)
    updateSettingsMarks(); updateBar()
    return false
  }
}

// ---- field builders ----

const ITALIC_HINT = 'Wrap words in *asterisks* for italics. No other markup.'
function sf(label, sp, input, hint, extra) {
  return el('div', { class: 'sf', dataset: { sp } }, label ? el('label', { class: 'f' }, label) : null, input, extra || null,
    hint ? el('div', { class: 'hint' }, hint) : null, el('div', { class: 'sf-err' }))
}
function sText(obj, key, sp, { label, multiline, placeholder, hint, max, nullable, mono, onAfter } = {}) {
  const count = max ? el('div', { class: 'count-l' }) : null
  const upd = () => {
    if (!count) return
    const n = String(obj[key] ?? '').length
    count.textContent = `${n} / ${max}`
    count.classList.toggle('over', n > max)
    count.title = n > max ? `Over ${max} characters — search results truncate it` : ''
  }
  const on = (e) => { const v = e.target.value; obj[key] = nullable && v === '' ? null : v; upd(); settingsChanged(); onAfter?.() }
  const input = multiline
    ? autoGrow(el('textarea', { class: 'auto' + (mono ? ' mono' : ''), rows: 2, value: obj[key] ?? '', placeholder, oninput: on, style: 'min-height:38px' }))
    : el('input', { type: 'text', value: obj[key] ?? '', placeholder, oninput: on, style: mono ? 'font-family:var(--mono);font-size:13px' : undefined })
  if (label) input.setAttribute('aria-label', label)
  upd()
  return sf(label, sp, input, hint, count)
}
function sNum(obj, key, sp, { label, min, max, step = 1, hint, onAfter } = {}) {
  const input = el('input', { type: 'number', value: obj[key] ?? '', min, max, step, 'aria-label': label || key,
    oninput: (e) => { const v = e.target.value; obj[key] = v === '' ? null : Number(v); settingsChanged(); onAfter?.() } })
  return sf(label, sp, input, hint)
}
function sCheck(obj, key, sp, label, { onAfter } = {}) {
  return el('div', { class: 'sf', dataset: { sp } }, el('label', { style: 'display:flex;gap:6px;align-items:center;font-size:13px' },
    el('input', { type: 'checkbox', checked: !!obj[key], onchange: (e) => { obj[key] = e.target.checked; settingsChanged(); onAfter?.() } }), label), el('div', { class: 'sf-err' }))
}
function sSelect(obj, key, sp, options, { label, hint, onAfter } = {}) {
  const vals = options.map((o) => (Array.isArray(o) ? o : [o, o]))
  if (obj[key] !== undefined && !vals.some(([v]) => v === obj[key])) vals.push([obj[key], `${obj[key]} (missing)`])
  const input = el('select', { 'aria-label': label || key, onchange: (e) => { obj[key] = e.target.value; settingsChanged(); onAfter?.() } },
    ...vals.map(([v, l]) => { const o = el('option', { value: v }, l); if (obj[key] === v) o.selected = true; return o }))
  return sf(label, sp, input, hint)
}
const cols = (tpl, ...kids) => el('div', { class: 's-cols', style: `grid-template-columns:${tpl}` }, ...kids)
const block = (title, hint, ...kids) => el('div', { class: 'section' }, el('h3', {}, title, hint ? el('span', { class: 'hint' }, hint) : null), ...kids)

// Reorderable list (sortable(): drag handles + drop indicator + Alt+↑/↓),
// with add and armed-second-click delete. renderBody(item, i, mkDel) builds
// a row; mkDel({ disabled, title }) makes its delete button.
function listEditor(arr, sp, renderBody, makeNew, { label = 'item', addLabel = '+ Add', empty = 'None yet.' } = {}) {
  const box = el('div', { class: 'sf', dataset: { sp } })
  const after = () => queueMicrotask(() => { settingsChanged(); if (!arr.length) draw() })
  const draw = (focusLast) => {
    const list = sortable(arr, (it, i, remove) => {
      const mkDel = ({ disabled, title } = {}) => {
        if (disabled) return el('span', { title, style: 'display:inline-block' }, el('button', { type: 'button', class: 'small danger', disabled: true, 'aria-label': `Delete ${label} ${i + 1} (unavailable: ${title})` }, '×'))
        const b = armed('×', 'Delete?', () => remove(), 'small danger')
        b.title = title || `Delete this ${label} (click twice)`
        b.setAttribute('aria-label', `Delete ${label} ${i + 1}`)
        return b
      }
      return renderBody(it, i, mkDel)
    }, after, { label })
    box.replaceChildren(arr.length ? list : el('div', { class: 'hint', style: 'margin-bottom:6px' }, empty),
      el('button', { type: 'button', class: 'small', onclick: () => { arr.push(makeNew()); draw(true); settingsChanged() } }, addLabel),
      el('div', { class: 'sf-err' }))
    if (focusLast) list.lastElementChild?.querySelector('input, textarea')?.focus()
    queueMicrotask(updateSettingsMarks)
  }
  draw()
  return box
}
function strList(arr, sp, { label = 'entry', multiline, placeholder, addLabel = '+ Add', hint } = {}) {
  return listEditor(arr, sp, (t, i, mkDel) => el('div', { class: 'sbody flat' },
    cols('minmax(0,1fr) auto', sText(arr, i, `${sp}.${i}`, { multiline, placeholder, hint: i === 0 ? hint : undefined }), mkDel())),
  () => '', { label, addLabel })
}

// Union of saved and unsaved project values: a key is "in use" if either uses it.
function usageNow() {
  const a = ST.usageOf(curProjects(), S.saved), b = ST.usageOf(savedProjects(), S.saved)
  const merge = (x, y) => { const o = {}; for (const src of [x, y]) for (const [k, fs] of Object.entries(src)) o[k] = [...new Set([...(o[k] || []), ...fs])]; return o }
  return {
    discipline: merge(a.discipline, b.discipline), console: merge(a.console, b.console), coverKind: merge(a.coverKind, b.coverKind),
    implicit: { console: [...new Set([...a.implicit.console, ...b.implicit.console])], coverKind: [...new Set([...a.implicit.coverKind, ...b.implicit.coverKind])] },
    roles: a.roles, creditRoles: a.creditRoles,
  }
}
function showProjectsWith(kind, key) {
  switchTab('projects')
  extraFilter = null; $('#f-disc').value = ''
  if (kind === 'discipline' && meta.enums.discipline.includes(key)) $('#f-disc').value = key
  else extraFilter = { kind, key }
  renderList()
}
function showRole(term) { switchTab('projects'); extraFilter = null; $('#f-role').value = term; renderList() }
const titleOf = (f) => cur[f]?.data.title || f

// Usage link, delete guard and key lock for a keyed row (discipline/console/coverKind).
function usageFor(U, kind, o) {
  const explicit = (U[kind][o.key] || [])
  const isDefault = S.cur.defaults?.[kind] === o.key && !!o.key
  const implicit = isDefault && U.implicit[kind] ? U.implicit[kind] : []
  const n = explicit.length + implicit.length
  const link = n
    ? el('a', { onclick: () => showProjectsWith(kind, o.key), title: 'Open the Projects tab filtered to this value' }, `${n} project${n === 1 ? '' : 's'}${implicit.length ? ` (${implicit.length} by default)` : ''} →`)
    : el('span', { class: 'hint' }, 'unused')
  const blocker = explicit.length
    ? `In use by ${explicit.length} project${explicit.length === 1 ? '' : 's'}: ${explicit.map(titleOf).slice(0, 8).join(', ')}${explicit.length > 8 ? '…' : ''}`
    : isDefault ? `This is the default ${kind} — choose another default first` : null
  const uses = explicit.length ? el('details', { class: 'uses' }, el('summary', {}, `used by ${explicit.length} — reassign to delete`),
    el('div', { style: 'margin-top:4px' }, ...explicit.map((f) => projLink(f, true)))) : null
  return { link, blocker, uses, locked: n > 0 }
}
function keyInput(o, sp, locked, list) {
  const input = el('input', { type: 'text', value: o.key, placeholder: 'kebab-key', readonly: locked || undefined,
    class: locked ? 'ro' : undefined, style: 'font-family:var(--mono);font-size:13px', 'aria-label': `${list} key`,
    title: locked ? 'Used by projects — the key is fixed. To rename, add a new entry, reassign the projects, then delete this one.' : 'kebab-case, unique',
    oninput: (e) => { o.key = e.target.value; autoKey.delete(o); settingsChanged() } })
  return sf('Key' + (locked ? ' 🔒' : ''), sp, input)
}
// Label that also drives the key of a brand-new row until the key is typed.
function labelInput(o, sp, keyEl, label = 'Label') {
  return sText(o, 'label', sp, { label, onAfter: () => {
    if (!autoKey.has(o)) return
    o.key = kebab(o.label || '')
    const k = keyEl.querySelector('input'); if (k) k.value = o.key
  } })
}
function defaultSelect(kind, list, label) {
  return sSelect(S.cur.defaults, kind, `defaults.${kind}`, (S.cur[list] || []).filter((o) => o.key).map((o) => [o.key, `${o.label || o.key} (${o.key})`]),
    { label, hint: 'Used when a project omits this field, and for new projects.', onAfter: () => renderSettings() })
}

function colorField(obj, key, sp, label, onAfter, { nullLabel } = {}) {
  const v0 = obj[key]
  const color = el('input', { type: 'color', value: ST.HEX_RE.test(v0 || '') ? v0.toLowerCase() : '#000000', 'aria-label': `${label} picker`, disabled: v0 === null || undefined })
  const text = el('input', { type: 'text', value: v0 ?? '', placeholder: '#rrggbb', style: 'width:110px;font-family:var(--mono)', 'aria-label': `${label} hex`, disabled: v0 === null || undefined })
  const sw = el('span', { style: 'display:inline-block;width:56px;height:30px;border-radius:6px;border:1px solid var(--line2)' })
  const paint = () => { sw.style.background = ST.HEX_RE.test(obj[key] || '') ? obj[key] : 'repeating-linear-gradient(45deg,#333 0 4px,#222 4px 8px)' }
  const set = (v) => { obj[key] = v; paint(); settingsChanged(); onAfter() }
  color.addEventListener('input', () => { text.value = color.value; set(color.value) })
  text.addEventListener('input', () => { if (ST.HEX_RE.test(text.value)) color.value = text.value.toLowerCase(); set(text.value) })
  const nul = nullLabel ? el('label', { style: 'display:flex;gap:6px;align-items:center;font-size:13px' },
    el('input', { type: 'checkbox', checked: v0 === null, onchange: (e) => {
      color.disabled = text.disabled = e.target.checked
      if (e.target.checked) set(null); else { text.value = color.value; set(color.value) }
    } }), nullLabel) : null
  paint()
  return sf(label, sp, el('div', { style: 'display:flex;gap:8px;align-items:center;flex-wrap:wrap' }, sw, color, text, nul))
}

function glowPicker(o, sp) {
  const c0 = ST.parseColor(o.glow) || { r: 180, g: 180, b: 180, a: 0.1 }
  const hex = (c) => '#' + [c.r, c.g, c.b].map((v) => v.toString(16).padStart(2, '0')).join('')
  const color = el('input', { type: 'color', value: hex(c0), 'aria-label': 'Glow colour' })
  const alpha = el('input', { type: 'range', min: 0, max: 0.5, step: 0.01, value: c0.a, 'aria-label': 'Glow opacity' })
  const aval = el('span', { class: 'hint', style: 'font-family:var(--mono);min-width:32px' }, c0.a.toFixed(2))
  const text = el('input', { type: 'text', value: o.glow, style: 'width:180px;font-family:var(--mono);font-size:12px', 'aria-label': 'Glow value' })
  const sw = el('div', { class: 'glow-swatch', title: 'Card glow on the dark background (as on project cards)' })
  const paint = () => { sw.style.backgroundImage = ST.parseColor(o.glow) ? `radial-gradient(120% 80% at 50% 100%, ${o.glow}, transparent 60%)` : 'none' }
  const fromPickers = () => {
    o.glow = ST.formatRgba({ ...ST.parseColor(color.value), a: Number(alpha.value) })
    text.value = o.glow; aval.textContent = Number(alpha.value).toFixed(2); paint(); settingsChanged()
  }
  color.addEventListener('input', fromPickers)
  alpha.addEventListener('input', fromPickers)
  text.addEventListener('input', () => {
    o.glow = text.value
    const c = ST.parseColor(text.value)
    if (c) { color.value = hex(c); alpha.value = c.a; aval.textContent = c.a.toFixed(2) }
    paint(); settingsChanged()
  })
  paint()
  return sf('Card glow', sp, el('div', { style: 'display:flex;gap:8px;align-items:center;flex-wrap:wrap' }, sw, color, alpha, aval, text))
}

// Rewrites every project role part `from` → `to` (unsaved edits) and drops
// `from` from the vocabulary.
function mergeRole(from, to) {
  let n = 0
  for (const f of order) {
    const d = cur[f].data, parts = rolesOf(d.role)
    if (!parts.includes(from)) continue
    d.role = [...new Set(parts.map((p) => (p === from ? to : p)))].join(' / ')
    markDirty(f); n++
  }
  const v = S.cur.roles.vocabulary
  const i = v.indexOf(from); if (i >= 0) v.splice(i, 1)
  if (!v.includes(to)) v.push(to)
  settingsChanged(); renderSettings(); renderList()
  if (n && selected) renderForm()
  toast(`Merged “${from}” into “${to}”${n ? ` — ${n} project role${n === 1 ? '' : 's'} rewritten (unsaved)` : ''}`, 'ok')
}

let sPrevSeq = 0
const previewPanel = () => el('div', { class: 'prev', id: 's-prev' }, el('h3', {}, 'Preview', el('span', { class: 'hint' }, 'loading…')))
async function loadSettingsPreview() {
  const box = $('#s-prev')
  if (!box) return
  const seq = ++sPrevSeq
  const errs = ST.validateSettings(S.cur)
  if (errs.length) { box.replaceChildren(el('h3', {}, 'Preview'), el('div', { class: 'hint', style: 'padding:12px' }, `Fix ${errs.length} error${errs.length === 1 ? '' : 's'} to preview.`)); return }
  try {
    const r = await api('POST', '/api/settings/preview', { settings: S.cur, projects: curProjects() })
    if (seq !== sPrevSeq || !document.contains(box)) return
    const link = (x) => el('a', { onclick: () => goTo(x.folder), style: 'color:inherit;cursor:pointer' }, x.title)
    const sum = (next, curr) => {
      const a = next.filter((x) => !curr.some((y) => y.folder === x.folder)).length
      const d = curr.filter((x) => !next.some((y) => y.folder === x.folder)).length
      const moved = next.some((x, i) => curr.findIndex((y) => y.folder === x.folder) !== i)
      return a || d ? `+${a} −${d} vs saved` : moved ? 'order changes' : 'no change'
    }
    box.replaceChildren(
      el('h3', {}, 'Homepage showcase', el('span', { class: 'hint' }, sum(r.next.home, r.current.home))),
      diffList(r.next.home, r.current.home, (x) => [link(x), x.hero ? el('span', { class: 'mv', style: 'color:var(--accent)' }, 'hero') : null, el('span', { class: 'sc' }, x.score)]),
      el('h3', {}, 'Résumé credits', el('span', { class: 'hint' }, `${r.next.resume.length} of ${r.next.resumeTotal} eligible · ${sum(r.next.resume, r.current.resume)}`)),
      diffList(r.next.resume, r.current.resume, (x) => [`${x.year} `, link(x), el('span', { class: 'sc' }, `${x.role} (${x.roleScore})`)]),
      el('div', { class: 'hint', style: 'padding:0 12px 10px' }, 'Includes unsaved project edits. Green = newly in, struck = drops out, ↑↓ = moves.'))
  } catch (e) {
    if (seq === sPrevSeq) box.replaceChildren(el('h3', {}, 'Preview'), el('div', { class: 'hint', style: 'padding:12px' }, `Preview failed: ${e.message}`))
  }
}
function diffList(next, curr, fmt) {
  const was = new Map(curr.map((x, i) => [x.folder, i]))
  const now = new Set(next.map((x) => x.folder))
  return el('ol', {},
    ...next.map((x, i) => {
      const j = was.get(x.folder)
      return el('li', { class: j === undefined ? 'add' : '' }, ...fmt(x), j !== undefined && j !== i ? el('span', { class: 'mv' }, j > i ? `↑${j - i}` : `↓${i - j}`) : null)
    }),
    ...curr.filter((x) => !now.has(x.folder)).map((x) => el('li', { class: 'del' }, ...fmt(x))))
}

// ---- tabs, shortcuts --------------------------------------------------------------------

function switchTab(t) {
  for (const b of document.querySelectorAll('.tabs button')) b.classList.toggle('active', b.dataset.tab === t)
  for (const v of document.querySelectorAll('.view')) v.classList.toggle('active', v.id === `view-${t}`)
  if (t === 'health') renderHealth()
  if (t === 'replace') renderReplace()
  if (t === 'settings') renderSettings()
  renderBulk()
}
const isTab = (t) => $(`#view-${t}`).classList.contains('active')
for (const b of document.querySelectorAll('.tabs button')) b.addEventListener('click', () => switchTab(b.dataset.tab))
$('#new-btn').addEventListener('click', openNew)
$('#help-btn').addEventListener('click', openHelp)

document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveAll(); return }
  if (e.key === 'Escape' && modalStack.length) { e.preventDefault(); modalStack[modalStack.length - 1].close(); return }
  if (modalStack.length) return
  if (e.key === 'Escape' && multi.size && isTab('projects')) { e.preventDefault(); clearSelection(); return }
  if (e.altKey && e.shiftKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
    e.preventDefault()
    const vis = visibleFolders(), i = vis.indexOf(selected)
    const n = vis[Math.max(0, Math.min(vis.length - 1, i + (e.key === 'ArrowUp' ? -1 : 1)))]
    if (n) { select(n); document.querySelector(`#list .item[data-folder="${CSS.escape(n)}"]`)?.scrollIntoView({ block: 'nearest' }) }
    return
  }
  if (typing(e)) return
  if (e.key === '?') { e.preventDefault(); openHelp() }
  else if (e.key === '/') { e.preventDefault(); switchTab('projects'); $('#f-q').focus() }
})

load().then(() => updateHealthCount())
</script>
</body>
